<!DOCTYPE html>
<html lang="es-MX" dir="ltr" data-theme="barberia" data-mode="dark" data-caps="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0A08" />
    <title>Reserva tu cita</title>
    <meta name="description" content="Reserva tu cita en línea: elige tu servicio, tu fecha y tu hora desde el celular." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Los colores, las letras y las esquinas NO están fijos: salen de variables CSS que cada
      // negocio cambia según su giro (ver services/themes.ts). Aquí solo se conectan a Tailwind:
      //   slate = fondos y textos      amber = color principal del negocio
      //   white = títulos (la "tinta")  black = texto sobre el color principal
      //   paper = blanco fijo (texto sobre botones verdes y rojos)   scrim = fondo oscuro de ventanas
      const v = name => `rgb(var(--${name}) / <alpha-value>)`;
      const ramp = (prefix, steps) => Object.fromEntries(steps.map(step => [step, v(`${prefix}-${step}`)]));
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: ramp('slate', [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950]),
              amber: ramp('accent', [50, 100, 200, 300, 400, 500, 600, 700, 800, 900]),
              white: v('ink'),
              black: v('on-accent'),
              paper: '#FFFFFF',
              scrim: v('scrim')
            },
            fontFamily: {
              sans: ['var(--font-body)'],
              display: ['var(--font-display)']
            },
            borderRadius: {
              lg: 'var(--r-lg)',
              xl: 'var(--r-xl)',
              '2xl': 'var(--r-2xl)',
              '3xl': 'var(--r-3xl)'
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Valores de la barbería: se usan al abrir la página y mientras carga el negocio.
         Después, services/themes.ts los reemplaza con los del giro del negocio. */
      :root {
      --ink: 255 255 255;
      --scrim: 0 0 0;
      --on-accent: 11 10 8;
      --font-display: 'Anton', Impact, sans-serif;
      --font-body: 'Archivo', system-ui, sans-serif;
      --h-weight: 400;
      --h-leading: 0.95;
      --r-lg: 0.25rem;
      --r-xl: 0.25rem;
      --r-2xl: 0.375rem;
      --r-3xl: 0.375rem;
      --sticker-border: 2px solid rgb(var(--slate-950));
      --sticker-shadow: 4px 4px 0 0 rgb(var(--slate-100));
      --sticker-shadow-down: 1px 1px 0 0 rgb(var(--slate-100));
      --sticker-press: translate(3px, 3px);
      --pop-accent: 4px 4px 0 0 rgb(var(--accent-500));
      --pop-ink: 4px 4px 0 0 rgb(var(--slate-100));
      --ticker-bg: rgb(var(--accent-500));
      --ticker-fg: rgb(var(--on-accent));
      --ticker-border: 3px solid rgb(var(--slate-950));
      --ticker-style: normal;
      --ticker-size: 0.95rem;
      --ticker-tracking: 0.08em;
      --font-ticker: var(--font-display);
      --pole-bg: repeating-linear-gradient(-45deg, rgb(var(--accent-500)) 0 12px, rgb(var(--slate-950)) 12px 24px);
      --grain: 0.07;
      --stamp: 230 57 70;
      --art-1: rgb(var(--accent-500));
      --art-2: #0B0A08;
      --art-3: #1D1A14;
      --bg-image: none;
      --btn-gradient: none;
      --btn-hover: none;
      --font-lead: var(--font-body);
      --logo-radius: 0.25rem;
      --logo-ring: none;
      --focus: 255 212 59;
      --slate-50: 250 244 227;
      --slate-100: 241 232 208;
      --slate-200: 228 219 196;
      --slate-300: 207 198 176;
      --slate-400: 168 159 138;
      --slate-500: 133 122 102;
      --slate-600: 92 82 66;
      --slate-700: 58 51 38;
      --slate-800: 34 30 23;
      --slate-900: 21 19 15;
      --slate-950: 11 10 8;
      --accent-50: 255 248 219;
      --accent-100: 255 239 176;
      --accent-200: 255 226 122;
      --accent-300: 255 212 59;
      --accent-400: 255 204 31;
      --accent-500: 242 183 5;
      --accent-600: 242 183 5;
      --accent-700: 217 154 0;
      --accent-800: 168 122 0;
      --accent-900: 90 67 0;
      }

      body {
        font-family: var(--font-body);
        background-color: rgb(var(--slate-950));
        /* Luces suaves de fondo (cada tema las define; la barbería no lleva) */
        background-image: var(--bg-image);
        background-attachment: fixed;
        background-repeat: no-repeat;
        color: rgb(var(--slate-100));
      }

      /* Frases de presentación (portada): en el tema Esencia van en una letra con más estilo */
      .lead-text { font-family: var(--font-lead); }
      html[data-theme='esencia'] .lead-text { font-size: 1.28em; line-height: 1.45; }

      /* Barras fijas translúcidas con desenfoque (temas oscuros con "glass") */
      html[data-glass='true'] .glass-bar {
        background-color: rgb(var(--slate-950) / 0.72);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }

      /* Tema Esencia: bordes dorados muy finos y cielo con estrellas, como el sitio de Pole Essence */
      html[data-theme='esencia'] .border-slate-800 { border-color: rgb(var(--accent-500) / 0.18); }
      html[data-theme='esencia'] .border-slate-700 { border-color: rgb(var(--accent-500) / 0.3); }
      html[data-theme='esencia'] body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        background-image:
          radial-gradient(1.2px 1.2px at 12% 18%, rgba(249,218,152,.9) 50%, transparent 51%),
          radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.8) 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 88% 62%, rgba(249,218,152,.8) 50%, transparent 51%),
          radial-gradient(1px 1px at 30% 72%, rgba(255,255,255,.7) 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 55% 40%, rgba(249,218,152,.7) 50%, transparent 51%),
          radial-gradient(1px 1px at 6% 88%, rgba(255,255,255,.7) 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 64% 90%, rgba(249,218,152,.8) 50%, transparent 51%);
        animation: starfield 5s ease-in-out infinite alternate;
      }
      @keyframes starfield { from { opacity: 0.45; } to { opacity: 1; } }

      /* Logo del negocio junto a su nombre */
      .brand-logo { border-radius: var(--logo-radius); box-shadow: var(--logo-ring); }

      /* Adorno de destello bajo el título (solo temas con "ornament") */
      .ornament { display: none; align-items: center; justify-content: center; gap: 0.75rem; margin-top: 1.5rem; }
      html[data-ornament='true'] .ornament { display: flex; }
      .ornament::before, .ornament::after {
        content: '';
        height: 1px;
        width: 4.5rem;
        background: linear-gradient(90deg, transparent, rgb(var(--accent-700)));
      }
      .ornament::after { background: linear-gradient(270deg, transparent, rgb(var(--accent-700))); }
      .ornament svg { width: 0.9rem; height: 0.9rem; fill: rgb(var(--accent-500)); }

      /* Títulos principales: la letra y el grosor los define el tema.
         Solo la barbería los pone en mayúsculas, como cartel de disco. */
      h1, h2 {
        font-family: var(--font-display);
        font-weight: var(--h-weight) !important;
        letter-spacing: 0.01em;
      }
      html[data-caps='true'] h1, html[data-caps='true'] h2 {
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      /* Textos que piden mayúsculas en la barbería ("Reserva tu cita"): en los demás giros se ven normales */
      html[data-caps='false'] .font-display.uppercase {
        text-transform: none;
        letter-spacing: 0.005em;
      }

      ::selection { background: rgb(var(--accent-500)); color: rgb(var(--on-accent)); }

      /* Contorno visible al navegar con teclado */
      :focus-visible { outline: 3px solid rgb(var(--focus)); outline-offset: 2px; }

      /* Textura de grano muy suave (solo la barbería: ahí el negro se vería plano) */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 60;
        opacity: var(--grain);
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }

      /* Texto legible sobre cualquier fondo del color principal (botones, fechas elegidas, menú activo) */
      .bg-amber-600, .bg-amber-600 * { color: rgb(var(--on-accent)) !important; }

      /* Temas claros: las tarjetas flotan con una sombra suave en lugar de un borde fuerte */
      html[data-mode='light'] .bg-slate-900 {
        box-shadow: 0 1px 2px rgb(var(--slate-50) / 0.06), 0 10px 26px -18px rgb(var(--slate-50) / 0.28);
      }

      /* Temas claros: rojos y verdes de texto más oscuros para que se lean sobre fondos claros */
      html[data-mode='light'] .text-red-500, html[data-mode='light'] .text-red-400, html[data-mode='light'] .text-red-300 { color: #B42318; }
      html[data-mode='light'] .text-green-500, html[data-mode='light'] .text-green-400 { color: #15803D; }

      /* Botón principal: en la barbería es un sticker con sombra dura que "se aplasta" al presionar;
         en los demás giros es un botón con sombra suave del color principal */
      .sticker {
        border: var(--sticker-border);
        box-shadow: var(--sticker-shadow);
        transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease, filter 0.15s ease;
        /* Degradado del botón (spa y esencia); en los demás temas no se aplica */
        background-image: var(--btn-gradient);
      }
      .sticker:hover:not(:disabled) { filter: var(--btn-hover); }
      .sticker:active:not(:disabled) {
        transform: var(--sticker-press);
        box-shadow: var(--sticker-shadow-down);
      }

      /* Tarjeta o botón elegido: sombra dura en la barbería, sombra suave en los demás giros */
      .pop-accent { box-shadow: var(--pop-accent); }
      .pop-ink { box-shadow: var(--pop-ink); }

      /* Encabezado de "cita confirmada" (en la barbería, el poste de barbero) */
      .pole { background: var(--pole-bg); }

      /* Sello de "reservado" */
      .stamp {
        display: inline-block;
        font-family: var(--font-display);
        letter-spacing: 0.12em;
        color: rgb(var(--stamp));
        border: 3px solid rgb(var(--stamp));
        padding: 0.15rem 0.7rem;
        transform: rotate(-5deg);
      }
      html[data-caps='true'] .stamp { text-transform: uppercase; }
      html[data-caps='false'] .stamp {
        letter-spacing: 0.04em;
        border-width: 2px;
        border-radius: var(--r-xl);
        font-style: italic;
        padding: 0.1rem 0.9rem;
      }

      /* ---------- Portadas (components/HeroArt.tsx) ---------- */

      /* Barbería: disco de vinilo con el ícono del giro en la etiqueta */
      .vinyl {
        position: relative;
        width: 15rem;
        height: 15rem;
        border-radius: 9999px;
        background: repeating-radial-gradient(circle at center, #0B0A08 0 2px, #1D1A14 2px 3px);
        /* Aro parejo del color principal (una sombra desplazada giraba con el disco y lo hacía verse descentrado) */
        box-shadow: 0 0 0 4px rgb(var(--accent-500));
        animation: vinyl-spin 10s linear infinite;
      }
      .vinyl::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: conic-gradient(from 20deg, transparent 0 18%, rgba(255,255,255,0.16) 24%, transparent 30% 68%, rgba(255,255,255,0.12) 74%, transparent 80%);
      }
      .vinyl-label {
        position: absolute;
        inset: 32%;
        border-radius: 9999px;
        background: rgb(var(--accent-500));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 3px #0B0A08;
      }
      .vinyl-label::after {
        content: '';
        position: absolute;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 9999px;
        background: #0B0A08;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      @keyframes vinyl-spin { to { transform: rotate(360deg); } }

      /* Estudios: el logo como protagonista, con halo de luz y estrellas */
      .logo-art { position: relative; width: 15rem; height: 15rem; }
      .logo-art::before {
        content: '';
        position: absolute;
        inset: -1.25rem;
        border-radius: 9999px;
        background: var(--art-1);
        opacity: 0.28;
        filter: blur(40px);
      }
      .logo-art img {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 2rem;
        box-shadow: 0 10px 40px -12px rgb(var(--accent-500) / 0.45);
      }
      .logo-art-stars { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); overflow: visible; z-index: 2; pointer-events: none; }

      /* Spa: ondas de agua que respiran lentamente */
      .hero-art { width: 15rem; height: 15rem; }
      .hero-art svg { width: 100%; height: 100%; overflow: visible; }
      .ripple-ring { transform-origin: 100px 100px; animation: ripple-breathe 7s ease-in-out infinite; }
      .ripple-ring:nth-of-type(2) { animation-delay: -1.4s; }
      .ripple-ring:nth-of-type(3) { animation-delay: -2.8s; }
      .ripple-ring:nth-of-type(4) { animation-delay: -4.2s; }
      @keyframes ripple-breathe {
        0%, 100% { transform: scale(0.97); opacity: 0.95; }
        50% { transform: scale(1.04); opacity: 0.7; }
      }

      /* Dentista: brillitos que parpadean */
      .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 3.4s ease-in-out infinite; }
      @keyframes twinkle {
        0%, 100% { transform: scale(0.6); opacity: 0.35; }
        50% { transform: scale(1); opacity: 1; }
      }

      /* Cinta de frases que se desplaza arriba de la página */
      .ticker {
        overflow: hidden;
        white-space: nowrap;
        background: var(--ticker-bg);
        color: var(--ticker-fg);
        border-bottom: var(--ticker-border);
      }
      .ticker-track {
        display: inline-flex;
        align-items: center;
        gap: 1.25rem;
        padding: 0.45rem 0;
        animation: ticker-move 30s linear infinite;
      }
      .ticker-item {
        font-family: var(--font-ticker);
        font-style: var(--ticker-style);
        letter-spacing: var(--ticker-tracking);
        font-size: var(--ticker-size);
      }
      html[data-caps='true'] .ticker-item { text-transform: uppercase; }
      @keyframes ticker-move { from { transform: translateX(0); } to { transform: translateX(-50%); } }

      /* Respeta a quien prefiere menos movimiento */
      @media (prefers-reduced-motion: reduce) {
        .vinyl, .ticker-track, .ripple-ring, .twinkle, html[data-theme='esencia'] body::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
