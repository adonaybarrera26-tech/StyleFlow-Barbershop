name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # En GitHub Pages la página vive en /StyleFlow-Barbershop/ (en un dominio propio sería '/')
          VITE_BASE: /StyleFlow-Barbershop/
          # Con '#' en la dirección: GitHub Pages no sabe abrir direcciones como /negocio/booking
          VITE_ROUTER: hash
          # La dirección raíz abre el negocio de ejemplo (así el enlace de la demo sigue funcionando)
          VITE_DEFAULT_BUSINESS: demo-barberia
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
