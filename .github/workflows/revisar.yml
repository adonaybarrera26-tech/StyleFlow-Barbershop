name: Revisar que compile

# Corre en cada pull request: si la app no compila, el PR sale con una X roja
# y se puede corregir antes de unirlo a main (y de publicar la página).
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
